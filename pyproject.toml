[project]
name = "doc-eval"
version = "0.1.0"
description = "CLI and Web UI to evaluate documents on multiple dimensions with TypeSafe"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "typesafe-sdk>=0.7.0",
]

[project.scripts]
doc-eval = "doc_eval.cli:main"
doc-eval-ui = "doc_eval.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_eval"]
